# Deploy the Container App whenever application code changes.
# Triggers on pushes to main that modify files under src/WebApp/ or src/FunctionApp/.
name: Deploy Application

on:
  push:
    branches:
      - main
    paths:
      - "src/WebApp/**"
      - "src/FunctionApp/**"
  workflow_call: {}   # Allow this workflow to be called by other workflows

env:
  ACR_NAME: ${{ vars.ACR_NAME }}                         # e.g. cscd396a3acr<suffix>
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}     # e.g. cscd396a3-ca-<suffix>
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}             # e.g. rg-cscd396-assignment3
  FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}       # e.g. cscd396a3-func-<suffix>
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # -----------------------------------------------------------------------
  # Build and push the Web App Docker image to ACR
  # -----------------------------------------------------------------------
  build-and-push-webapp:
    name: Build & Push Web App Image
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        working-directory: src/WebApp
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/webapp:${{ env.IMAGE_TAG }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/webapp:latest \
            .
          docker push ${{ env.ACR_NAME }}.azurecr.io/webapp:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/webapp:latest

  # -----------------------------------------------------------------------
  # Deploy the Web App to Azure Container App
  # -----------------------------------------------------------------------
  deploy-webapp:
    name: Deploy Web App to Container App
    runs-on: ubuntu-latest
    needs: build-and-push-webapp

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/webapp:${{ env.IMAGE_TAG }}

  # -----------------------------------------------------------------------
  # Build and deploy the Azure Function App
  # -----------------------------------------------------------------------
  deploy-function:
    name: Deploy Azure Function App
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Function App
        working-directory: src/FunctionApp
        run: dotnet publish FunctionApp.csproj -c Release -o ./publish

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: src/FunctionApp/publish
