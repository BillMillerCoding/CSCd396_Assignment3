# Deploy Terraform infrastructure whenever IaC files change.
# After Terraform finishes, it automatically triggers deploy-app.yml to redeploy the application.
name: Deploy Infrastructure (Terraform)

on:
  push:
    branches:
      - main
    paths:
      - "iac/**"

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: iac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure (for backend access)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.8"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="container_image=${{ vars.ACR_NAME }}.azurecr.io/webapp:latest" \
            -var="container_registry_server=${{ vars.ACR_NAME }}.azurecr.io" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # -----------------------------------------------------------------------
  # Redeploy application code after Terraform finishes
  # -----------------------------------------------------------------------
  redeploy-app:
    name: Redeploy Application After Terraform
    needs: terraform
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-app.yml
    secrets: inherit
